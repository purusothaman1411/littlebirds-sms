spring.application.name=sms-backend
server.port=${SERVER_PORT:8080}

# --- MySQL (values come from environment variables; defaults are for local development only) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/little_birds_sms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# The SQL files in backend/db are the source of truth; Hibernate only checks that entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JSON ---
spring.jackson.default-property-inclusion=non_null

# --- Security / JWT (secret is REQUIRED: set the JWT_SECRET environment variable, at least 32 characters) ---
sms.jwt.secret=${JWT_SECRET}
sms.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:480}

# --- First-run Headmaster (only used when there are no staff accounts yet) ---
sms.admin.id=${SMS_ADMIN_ID:ST001}
sms.admin.name=${SMS_ADMIN_NAME:Headmaster}
sms.admin.username=${SMS_ADMIN_USERNAME:}
sms.admin.password=${SMS_ADMIN_PASSWORD:}
